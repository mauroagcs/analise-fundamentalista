<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2a78d6">
<title>Sócio de Empresas</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sócio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f4f4f1; --card:#fff; --ink:#161614; --ink2:#5d5d58; --line:#e3e3de; --chip:#ecece7;
  --accent:#2a78d6; --good:#0d7a4e; --bad:#c0392b; --neg:#eb6834;
  --okbg:#e3f5ec; --warnbg:#fff4d6; --warnink:#7a5600; --track:#e9e9e4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --tab:60px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121211; --card:#1c1c1a; --ink:#f0efec; --ink2:#a9a8a0; --line:#2e2e2b; --chip:#2a2a27;
    --accent:#3987e5; --good:#3ecf8e; --bad:#ff7b6b; --neg:#d95926;
    --okbg:#12301f; --warnbg:#3a2f10; --warnink:#f1c76a; --track:#2a2a27;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
.muted{color:var(--ink2)}
.small{font-size:13px}
#tela{padding:12px 12px calc(var(--tab) + 28px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}

/* barra de abas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--tab);
  text-decoration:none;color:var(--ink2);font-size:12px}
.tabbar a span{font-size:22px;line-height:1}
.tabbar a[aria-current=page]{color:var(--accent);font-weight:600}

/* topo e controles */
.topo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 2px 10px}
.topo h1{font-size:22px}
.ctl{display:grid;gap:8px;margin-bottom:10px}
.inp{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select.inp{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip button{border:0;background:none;min-width:30px;min-height:30px;font-size:20px;line-height:1;color:var(--ink2)}
.hint{font-size:13px;color:var(--ink2);margin:0 2px 8px}
#contagem{font-weight:600;margin:6px 2px 8px}

/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.card:active{background:var(--chip)}
.l1{display:flex;align-items:center;gap:8px}
.tk{font-size:18px;font-weight:700;flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.px{font-weight:600;white-space:nowrap}
.star{flex:0 0 auto;width:44px;height:44px;margin:-6px -8px -6px 0;border:0;background:none;font-size:24px;color:var(--ink2);border-radius:22px}
.star.on{color:#eda100}
.l2{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 8px}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mets div{display:flex;flex-direction:column;min-width:0}
.ml{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em}
.mv{font-weight:600;font-size:15px;white-space:nowrap}
.b{font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.b.ok{background:var(--okbg);color:var(--good)}
.b.fin{background:var(--warnbg);color:var(--warnink)}
.mais{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;margin:4px 0 12px}
details.sobre{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.sobre summary{min-height:44px;display:flex;align-items:center;font-weight:600}
details.sobre p{margin:0 0 10px;font-size:14px;color:var(--ink2)}

/* detalhe */
#detalhe{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding-bottom:calc(var(--tab) + 28px + env(safe-area-inset-bottom))}
#detalhe[hidden]{display:none}
.dtop{position:sticky;top:0;z-index:5;height:56px;display:flex;align-items:center;gap:6px;padding:0 8px;
  background:var(--card);border-bottom:1px solid var(--line)}
.back{min-width:48px;height:44px;border:0;background:none;font-size:15px;color:var(--accent);font-weight:600;border-radius:10px}
.dtop .dt{flex:1;min-width:0;line-height:1.15}
.dtop .dt b{display:block;font-size:17px}
.dtop .dt span{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtop .star{margin:0}
.dwrap{max-width:720px;margin:0 auto;padding:0 12px}
.dhead{padding:14px 2px 6px}
.dprice{font-size:30px;font-weight:700}
.dsub{font-size:13px;color:var(--ink2);margin:2px 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat{display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat .mv{font-size:16px}
.seg{position:sticky;top:56px;z-index:4;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0;background:var(--bg)}
.seg button{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:14px}
.seg button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.alert{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.alert.warn{background:var(--warnbg);color:var(--warnink)}
.alert.ok{background:var(--okbg);color:var(--good);font-weight:600}
h3.sec{font-size:17px;margin:18px 2px 8px}
h4.grp{font-size:12px;margin:16px 2px 6px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks .b{font-size:13px;padding:6px 10px;border-radius:16px}
.checks .b.no{background:var(--warnbg);color:var(--warnink)}
ul.pts{list-style:none;margin:0;padding:0}
ul.pts li{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;font-size:15px}
ul.pts li:last-child{border-bottom:0}
ul.pts li i{font-style:normal;flex:0 0 auto}
.src{font-size:12px;color:var(--ink2);margin:10px 2px 4px}
ul.dif{margin:8px 0 0;padding-left:20px}
ul.dif li{margin-bottom:4px}
.ir{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ir:last-child{border-bottom:0}
.ir .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ir .rl{font-size:15px}
.ir .rv{font-weight:700;font-size:17px;white-space:nowrap}
.ir .rd{font-size:12.5px;margin-top:2px}
.rd.good{color:var(--good)} .rd.bad{color:var(--bad)} .rd.neu{color:var(--ink2)}
.ir .ra{display:none;font-size:13px;color:var(--ink2);margin-top:4px}
.ir.open .ra{display:block}

/* barras em HTML (texto sempre em tamanho real) */
.bars{display:grid;gap:6px;padding:8px 0 10px}
.br{display:grid;grid-template-columns:40px 1fr 90px;gap:8px;align-items:center;font-size:14px}
.br.w{grid-template-columns:64px 1fr 80px}
.br .t{height:14px;background:var(--track);border-radius:7px;overflow:hidden}
.br .f{height:100%;border-radius:7px;background:var(--accent);min-width:2px}
.br .f.neg{background:var(--neg)}
.br .f.hat{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px)}
.br .v{text-align:right;font-weight:600;white-space:nowrap}
.br .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.kpis .stat .ml{display:block;margin-bottom:2px;text-transform:none;letter-spacing:0}
.pos{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.pos:last-child{border-bottom:0}
.pos .pt{grid-column:1/3;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.pos .pt div{height:100%;background:var(--accent)}
.pos .pv{font-weight:700;text-align:right}

/* comparador */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:10px 0}
table.cmp{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
table.cmp th,table.cmp td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.cmp th:first-child,table.cmp td:first-child{position:sticky;left:0;text-align:left;background:var(--card);z-index:1;
  border-right:1px solid var(--line);font-weight:500;width:112px;min-width:112px;white-space:normal;line-height:1.2}
table.cmp tr:last-child td{border-bottom:0}
table.cmp td.best{background:var(--okbg);color:var(--good);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:6px}
.opts{display:grid;gap:6px;margin:8px 0}
.opt{min-height:46px;text-align:left;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt:disabled{opacity:.5}
.cbar{margin:6px 0 14px}
.cbar h4{margin:0 0 2px;font-size:14px}

/* favoritas */
textarea.nota{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);
  font-size:16px;resize:vertical;margin:10px 0 6px}
.acts{display:flex;gap:8px;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.salvo{margin-left:auto;font-size:12px;color:var(--ink2);min-width:56px;text-align:right}
.empty{text-align:center;color:var(--ink2);padding:36px 12px}
.empty b{display:block;font-size:40px;margin-bottom:6px}

/* aviso desfazer: fixo, não empurra nada */
#toast{position:fixed;left:12px;right:12px;bottom:calc(var(--tab) + 10px + env(safe-area-inset-bottom));z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:4px 6px 4px 14px;border-radius:12px;
  background:#222;color:#fff;max-width:520px;margin:0 auto;visibility:hidden;opacity:0;transition:opacity .15s}
#toast.on{visibility:visible;opacity:1}
#toast button{border:0;background:none;color:#8fc1ff;font-weight:700;min-height:44px;padding:0 12px}
</style>
</head>

      h += `<div class="card" style="cursor:default"><div class="l1"><div class="tk">${t}${a.socio ? '<span class="b ok">✓ Sócio</span>' : ''}${a.f ? '<span class="b fin">🏦 à parte</span>' : ''}</div><div class="px">${fmt(a.c, 'preco')}</div></div>
        <div class="l2">${esc(a.n)}</div>
        <div class="mets">${metrica('ROE', fmt(a.i.roe, 'pct'))}${metrica('P/L', fmt(a.i.pl, 'x'))}${metrica('Yield', fmt(a.i.dy, 'pct'))}${metrica('Dív/EBITDA', a.f ? 'à parte' : fmt(a.i.div_liq_ebitda, 'x'))}</div>
        <textarea class="nota" data-nota="${t}" placeholder="Notas pessoais: por que quero ser sócio? O que vigiar?" aria-label="Notas de ${t}">${esc(FAV[t].nota || '')}</textarea>
        <div class="acts"><button class="btn pri" data-abrir="${t}">Analisar</button><button class="btn" data-rmfav="${t}">Remover</button><span class="salvo" data-salvo="${t}"></span></div></div>`;
    }
  }
  $('#tela').innerHTML = h;
}

/* =================================================================== SOBRE */
function telaSobre() {
  $('#tela').innerHTML = `<div class="topo"><h1>Sobre esta prévia</h1></div>
    <div class="box" style="padding:14px"><p style="margin-top:0"><b>É um retrato.</b> Os dados foram gerados em <b>${esc(dataBR(D.gerado_em))}</b> a partir do app do computador. Para atualizar, rode <code>python gerar_mobile.py</code> lá e abra o arquivo novo.</p>
    <p><b>Funciona sem internet</b>, mas não busca cotações nem gera resumos de IA — só mostra os que já estavam salvos.</p>
    <p><b>Favoritas, notas e comparador</b> ficam guardados só neste navegador (não sincronizam com o app do computador).</p>
    <p><b>Filtro Sócio</b> (fixo nesta prévia): ações ON final 3, liquidez ≥ R$ 1 mi/dia, ROE &gt; 15% (10% em energia, saneamento e gás), margem líquida &gt; 0 e Dív.Líq/EBITDA &lt; 3. Bancos e seguradoras: sem Dív./EBITDA, “analisar à parte”.</p>
    <p><b>Selo de consistência (◆ 0–5):</b> quantos de 5 testes de história a empresa passa em até 10 anos de balanços — lucro quase sempre positivo, lucro crescente, ROE ≥ 15% em 4 dos últimos 5 anos, Dív.Líq/EBITDA &lt; 3 em 4 dos últimos 5 e caixa operacional positivo em 4 dos últimos 5 (os dois últimos não se aplicam a bancos).</p>
    <p><b>Fontes:</b> fundamentus.com.br e dados abertos da CVM.</p>
    <p style="margin-bottom:0">Ferramenta de estudo — <b>não é recomendação de investimento</b>. Os dados podem ter erros ou atrasos.</p></div>`;
}

/* =================================================================== EVENTOS (delegação) */
document.addEventListener('click', e => {
  const t = e.target;
  const star = t.closest('[data-star]');
  if (star) { e.stopPropagation(); alternarFav(star.dataset.star); return; }
  const card = t.closest('.card[data-t]');
  if (card && !t.closest('button')) { location.hash = '#/acao/' + card.dataset.t; return; }
  if (t.closest('#voltar')) { if (navegou > 0 && history.length > 1) history.back(); else location.hash = '#/'; return; }
  const aba = t.closest('button[data-aba]');
  if (aba) { const d = $('#detalhe'); history.replaceState(null, '', `#/acao/${d.dataset.t}/${aba.dataset.aba}`); abrirDetalhe(d.dataset.t, aba.dataset.aba); return; }
  if (t.closest('#aoComparar')) { addCmp($('#detalhe').dataset.t); return; }
  const ir = t.closest('[data-ajuda]');
  if (ir) { ir.classList.toggle('open'); return; }
  if (t.closest('#chipSocio')) { ST.socio = !ST.socio; ST.limite = 60; $('#chipSocio').setAttribute('aria-pressed', ST.socio); desenharLista(); return; }
  if (t.closest('#chipCons')) { ST.cons = !ST.cons; ST.limite = 60; $('#chipCons').setAttribute('aria-pressed', ST.cons); desenharLista(); return; }
  if (t.closest('#chipOn')) { ST.on = !ST.on; ST.limite = 60; $('#chipOn').setAttribute('aria-pressed', ST.on); desenharLista(); return; }
  if (t.closest('#maisbtn')) { ST.limite += 60; desenharLista(); return; }
  const add = t.closest('[data-addcmp]');
  if (add) { addCmp(add.dataset.addcmp); return; }
  const rm = t.closest('[data-rmcmp]');
  if (rm) { CMP = CMP.filter(x => x !== rm.dataset.rmcmp); salvarCmp(); desenharTela(); return; }
  const ab = t.closest('[data-abrir]');
  if (ab) { location.hash = '#/acao/' + ab.dataset.abrir; return; }
  const rf = t.closest('[data-rmfav]');
  if (rf) { alternarFav(rf.dataset.rmfav); return; }
});
document.addEventListener('keydown', e => {
  const card = e.target.closest && e.target.closest('.card[data-t]');
  if (card && e.target === card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); location.hash = '#/acao/' + card.dataset.t; }
});
let buscaTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'busca') { clearTimeout(buscaTimer); buscaTimer = setTimeout(() => { ST.q = t.value; ST.limite = 60; desenharLista(); }, 120); }
  else if (t.id === 'cmpq') cmpResultados(t.value);
  else if (t.dataset && t.dataset.nota) {
    const k = t.dataset.nota;
    clearTimeout(notaTimer[k]);
    const lbl = $(`[data-salvo="${k}"]`);
    if (lbl) lbl.textContent = '…';
    notaTimer[k] = setTimeout(() => { if (FAV[k]) { FAV[k].nota = t.value; salvarFav(); } if (lbl) lbl.textContent = 'salvo ✓'; }, 400);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'setor') { ST.setor = e.target.value; ST.limite = 60; desenharLista(); }
  else if (e.target.id === 'ordem') { ST.ordem = e.target.value; ST.limite = 60; desenharLista(); }
});

// PWA: só quando servido por http(s) (em file:// o navegador não permite service worker)
try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js'); } catch (e) {}

render();
</script>
</body>
</html>
